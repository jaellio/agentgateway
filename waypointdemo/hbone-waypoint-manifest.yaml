apiVersion: v1
kind: Namespace
metadata:
  name: agw-waypoint-mesh-e2e
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: agw-waypoint-params
  namespace: agw-waypoint-mesh-e2e
spec:
  istio:
    enabled: true
  service:
    spec:
      type: ClusterIP
  deployment:
    spec:
      template:
        metadata:
          labels:
            istio.io/dataplane-mode: none
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agw-waypoint
  namespace: agw-waypoint-mesh-e2e
spec:
  gatewayClassName: agentgateway-waypoint
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agw-waypoint-params
  listeners:
  - name: hbone
    port: 15008
    protocol: HBONE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: agw-waypoint-mesh-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: hashicorp/http-echo:1.0
        args: ["-text=backend-waypoint-ok", "-listen=:8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: agw-waypoint-mesh-e2e
  labels:
    istio.io/use-waypoint: agw-waypoint
spec:
  selector:
    app: backend
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-direct
  namespace: agw-waypoint-mesh-e2e
spec:
  selector:
    app: backend
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-waypoint-policy-header
  namespace: agw-waypoint-mesh-e2e
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: backend
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /header-demo
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add:
        - name: x-waypoint-policy
          value: applied-at-waypoint
    backendRefs:
    - group: ""
      kind: Service
      name: backend-direct
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: agw-waypoint-mesh-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: curl
        image: curlimages/curl:8.12.1
        command: ["sh", "-c", "sleep 3600"]
